services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentops
      MYSQL_USER: agentops
      MYSQL_PASSWORD: agentops
      MYSQL_ROOT_PASSWORD: root
    ports: ["13306:3306"]
    volumes: ["./docker/mysql-init:/docker-entrypoint-initdb.d"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7.4-alpine
    ports: ["16379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  kafka:
    image: apache/kafka:3.9.1
    ports: ["19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  wiremock:
    image: wiremock/wiremock:3.13.1
    ports: ["18090:8080"]
    volumes: ["./agentops-test-support/src/main/resources/wiremock:/home/wiremock"]
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports: ["18474:8474", "18091:18091"]
    command: ["-host", "0.0.0.0"]
