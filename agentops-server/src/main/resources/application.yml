server:
  port: ${SERVER_PORT:18080}
  netty:
    connection-timeout: 5s
spring:
  application.name: agentops-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:13306/agentops?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:agentops}
    password: ${MYSQL_PASSWORD:agentops}
    hikari: {maximum-pool-size: 12, minimum-idle: 2}
  flyway: {enabled: true}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:16379}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        agentops.gateway.first_token: true
        agentops.gateway.duration: true
        agentops.gateway.finalization.queue: true
        agentops.gateway.terminal_to_finalized: true
      slo:
        agentops.gateway.first_token: 100ms,250ms,500ms,1s,2s
        agentops.gateway.terminal_to_finalized: 50ms,100ms,250ms,500ms,1s,2s
agentops:
  admin-token: ${AGENTOPS_ADMIN_TOKEN:local-admin-token}
  provider-base-url: ${PROVIDER_BASE_URL:http://localhost:18090}
  provider-api-key: ${PROVIDER_API_KEY:wiremock-key}
  default-max-tokens: 1024
  project-max-tokens: 4096
  safety-margin-tokens: 128
  reservation-timeout: 2m
  stream-buffer-size: 64
  # QUERYABLE requires a provider generation ID and an endpoint returning final request usage.
  provider-settlement-mode: ${PROVIDER_SETTLEMENT_MODE:ESTIMATE_FALLBACK}
  provider-usage-query-path: ${PROVIDER_USAGE_QUERY_PATH:}
  usage-query-deadline: ${USAGE_QUERY_DEADLINE:15m}
  usage-query-retry-limit: ${USAGE_QUERY_RETRY_LIMIT:6}
resilience4j.circuitbreaker.instances.provider:
  sliding-window-size: 20
  minimum-number-of-calls: 5
  failure-rate-threshold: 50
  wait-duration-in-open-state: 10s
